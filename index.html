<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 게임 모음</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      box-sizing: border-box;
      background: radial-gradient(ellipse at top, #1d1a4a 0%, #0b0a24 60%, #05040f 100%);
      color: #fff;
      font-family: "Malgun Gothic", sans-serif;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 8vw, 44px);
      text-align: center;
    }
    .sub {
      margin: 0 0 28px;
      color: #a9b3d6;
      font-size: clamp(14px, 3.8vw, 18px);
    }

    /* 게임 카드 두 개 (휴대폰에서는 위아래로) */
    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 760px;
    }
    .card {
      flex: 1 1 300px;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover { transform: translateY(-6px); }

    /* 그림 영역 */
    .preview {
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .info { padding: 16px 18px 20px; }
    .info h2 { margin: 0 0 6px; font-size: 24px; }
    .info p { margin: 0 0 12px; font-size: 15px; line-height: 1.5; }
    .record { font-size: 14px; margin-bottom: 14px; min-height: 1em; }
    .play {
      display: inline-block;
      padding: 9px 22px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 17px;
    }

    /* --- 벽돌깨기 카드: 네온 --- */
    .breakout {
      background: #0b0624;
      border: 2px solid #01cdfe;
      box-shadow: 0 0 14px rgba(1, 205, 254, 0.5);
    }
    .breakout:hover { box-shadow: 0 0 28px rgba(1, 205, 254, 0.8); }
    .breakout .preview { flex-direction: column; gap: 22px; }
    .bricks { display: grid; grid-template-columns: repeat(6, 32px); gap: 5px; }
    .bricks span { height: 11px; border-radius: 3px; border: 2px solid; }
    .ball { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #01cdfe; }
    .paddle { width: 70px; height: 10px; border-radius: 5px; background: #01cdfe; box-shadow: 0 0 12px #01cdfe; }
    .breakout .info p { color: #9aa3c7; }
    .breakout .record { color: #f9f871; }
    .breakout .play { border: 2px solid #05ffa1; color: #05ffa1; box-shadow: 0 0 8px #05ffa1; }

    /* --- 지뢰찾기 카드: 섬 --- */
    .mines {
      background: #1f3060;
      border: 2px solid #ffd166;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .mines:hover { box-shadow: 0 10px 28px rgba(255, 209, 102, 0.35); }
    .mines .preview { background: #14213d; }
    .tiles { display: grid; grid-template-columns: repeat(7, 26px); gap: 2px; }
    .tiles span {
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      border-radius: 2px;
    }
    .g { background: #43a047; box-shadow: inset 2px 2px 0 #66bb6a, inset -2px -2px 0 #2e7d32; }
    .s { background: #2f80c8; }
    .l { background: #e9d8a6; color: #1565c0; }
    .l.two { color: #2e7d32; }
    .mines .info p { color: #c3cde6; }
    .mines .record { color: #ffd166; }
    .mines .play { background: #ffd166; color: #222; }
  </style>
</head>
<body>
  <h1>🎮 미니 게임 모음</h1>
  <p class="sub">하고 싶은 게임을 골라 주세요</p>

  <div class="cards">
    <!-- 벽돌깨기 -->
    <a class="card breakout" href="breakout.html">
      <div class="preview">
        <div class="bricks">
          <span style="border-color:#ff2a6d"></span><span style="border-color:#ff2a6d"></span><span style="border-color:#ff2a6d"></span><span style="border-color:#ff2a6d"></span><span style="border-color:#ff2a6d"></span><span style="border-color:#ff2a6d"></span>
          <span style="border-color:#ff9e00"></span><span style="border-color:#ff9e00"></span><span></span><span style="border-color:#ff9e00"></span><span style="border-color:#ff9e00"></span><span style="border-color:#ff9e00"></span>
          <span style="border-color:#f9f871"></span><span></span><span></span><span style="border-color:#f9f871"></span><span style="border-color:#f9f871"></span><span></span>
        </div>
        <div class="ball"></div>
        <div class="paddle"></div>
      </div>
      <div class="info">
        <h2>🧱 네온 벽돌깨기</h2>
        <p>패들로 공을 튕겨 벽돌을 모두 깨요.<br>레벨이 오를수록 공이 빨라져요!</p>
        <div class="record" id="breakoutRecord"></div>
        <span class="play">▶ 플레이</span>
      </div>
    </a>

    <!-- 지뢰찾기 -->
    <a class="card mines" href="minesweeper.html">
      <div class="preview">
        <div class="tiles">
          <span class="g"></span><span class="g"></span><span class="l">1</span><span class="s"></span><span class="s"></span><span class="l">1</span><span class="g"></span>
          <span class="g"></span><span class="l two">2</span><span class="l">1</span><span class="s"></span><span class="s"></span><span class="l">1</span><span class="g"></span>
          <span class="l">1</span><span class="l">1</span><span class="s"></span><span class="s"></span><span class="s"></span><span class="l">1</span><span class="l">1</span>
          <span class="s"></span><span class="s"></span><span class="s"></span><span class="l">1</span><span class="l">1</span><span class="s"></span><span class="s"></span>
          <span class="s"></span><span class="s"></span><span class="l">1</span><span class="g">🚩</span><span class="l two">2</span><span class="s"></span><span class="s"></span>
        </div>
      </div>
      <div class="info">
        <h2>🏝️ 섬 지뢰찾기</h2>
        <p>풀을 걷어 내고 바다와 섬을 찾아요.<br>숫자를 보고 지뢰를 피하세요!</p>
        <div class="record" id="minesRecord">💣 지뢰 150개 · 40×30칸</div>
        <span class="play">▶ 플레이</span>
      </div>
    </a>
  </div>

  <script>
    // 벽돌깨기 최고 점수 보여주기 (벽돌깨기가 브라우저에 저장해 둔 기록)
    try {
      const best = JSON.parse(localStorage.getItem("breakoutBest"));
      if (best && best.score > 0) {
        const who = best.name ? " (" + best.name + ")" : "";
        document.getElementById("breakoutRecord").textContent = "👑 최고 점수 " + best.score + "점" + who;
      }
    } catch (e) {}

    // 지뢰찾기 최고 기록 (가장 빠른 클리어 시간)
    try {
      const best = JSON.parse(localStorage.getItem("minesBest"));
      if (best && best.time > 0) {
        const who = best.name ? " (" + best.name + ")" : "";
        document.getElementById("minesRecord").textContent = "👑 최고 기록 " + best.time + "초" + who;
      }
    } catch (e) {}
  </script>
</body>
</html>
